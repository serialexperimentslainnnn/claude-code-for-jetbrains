complexity:
  active: true
  CognitiveComplexMethod:
    active: false
    threshold: 15
  ComplexCondition:
    active: true
    threshold: 4
  ComplexInterface:
    active: false
    threshold: 10
    includeStaticDeclarations: false
    includePrivateDeclarations: false
    ignoreOverloaded: false
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    nestingFunctions:
      - 'also'
      - 'apply'
      - 'forEach'
      - 'isNotNull'
      - 'ifNull'
      - 'let'
      - 'run'
      - 'use'
      - 'with'
  LabeledExpression:
    active: false
    ignoredLabels: []
  LargeClass:
    active: true
    threshold: 600
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    # ignoreDefaultParameters: true — count only the parameters a caller MUST supply.
    # The problem this rule exists to catch is a call site nobody can read: a row of positional arguments whose
    # meaning depends on counting commas. A parameter with a default is not part of that problem — it is absent
    # from the call unless someone opts in, by name. Under this setting TranscriptEntry counts 3 (not 9),
    # PermissionBroker 5 (not 9), and the launch options 4 (not 14), which matches what those call sites
    # actually look like. The thresholds stay at detekt's defaults for the parameters that are mandatory, where
    # a long list really does mean the callee is doing too much.
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  MethodOverloading:
    active: false
    threshold: 6
  NamedArguments:
    active: false
    threshold: 3
    ignoreArgumentsMatchingNames: false
  NestedBlockDepth:
    active: true
    threshold: 4
  NestedScopeFunctions:
    active: false
    threshold: 1
    functions:
      - 'kotlin.apply'
      - 'kotlin.run'
      - 'kotlin.with'
      - 'kotlin.let'
      - 'kotlin.also'
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    threshold: 3
    ignoreAnnotation: true
    excludeStringsWithLessThan5Characters: true
    ignoreStringsRegex: '$^'
  TooManyFunctions:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    # Objects here are NAMESPACES, not god-objects: ControlProtocol is one named builder per control message
    # (34 of them, because the protocol has 34), SensitiveGuard is a set of pure predicates, ControlProtocol's
    # sibling parsers likewise. Splitting a module into ControlProtocolA/ControlProtocolB to satisfy a counter
    # makes it strictly harder to find things. Classes are where a high count is a real signal, because a class
    # has state and each method is another thing that can touch it — so classes keep a much tighter bound.
    # ClaudeSession, at 47, is exactly the case the rule is for, and it is being fixed rather than exempted.
    thresholdInFiles: 40
    thresholdInClasses: 20
    thresholdInInterfaces: 11
    thresholdInObjects: 40
    thresholdInEnums: 11
    ignoreDeprecated: false
    # ignorePrivate: true. With the default (count everything) this rule is in DIRECT CONFLICT with
    # CyclomaticComplexMethod and LongMethod: the prescribed fix for a long method is to break it into named
    # private helpers, and every helper you extract pushes the class closer to failing this rule. Optimising for
    # both at once means one inlined 80-line method — which is the thing we were trying to avoid.
    # What the rule claims to measure is "does this type do too much", and the honest proxy for that is its
    # PUBLIC surface: how many things can call into it. A parser object with 4 entry points and 15 private
    # helpers is a well-decomposed one, not a god object. Counting only the public API keeps the rule pointed at
    # ClaudeSession-shaped problems (many callers, many responsibilities) instead of at good decomposition.
    ignorePrivate: true
    ignoreOverridden: false
    ignoreAnnotatedFunctions: []

