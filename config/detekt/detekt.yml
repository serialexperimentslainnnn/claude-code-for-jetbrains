        value: 'takeUnless'
      - reason: 'Use `all` instead.'
        value: 'none'
    negativeFunctionNameParts:
      - 'not'
      - 'non'
  EqualsNullCall:
    active: true
  EqualsOnSignatureLine:
    active: false
  ExplicitCollectionElementAccessMethod:
    active: false
  ExplicitItLambdaParameter:
    active: true
  ExpressionBodySyntax:
    active: false
    includeLineWrapping: false
  ForbiddenAnnotation:
    active: false
    annotations:
      - reason: 'it is a java annotation. Use `Suppress` instead.'
        value: 'java.lang.SuppressWarnings'
      - reason: 'it is a java annotation. Use `kotlin.Deprecated` instead.'
        value: 'java.lang.Deprecated'
      - reason: 'it is a java annotation. Use `kotlin.annotation.MustBeDocumented` instead.'
        value: 'java.lang.annotation.Documented'
      - reason: 'it is a java annotation. Use `kotlin.annotation.Target` instead.'
        value: 'java.lang.annotation.Target'
      - reason: 'it is a java annotation. Use `kotlin.annotation.Retention` instead.'
        value: 'java.lang.annotation.Retention'
      - reason: 'it is a java annotation. Use `kotlin.annotation.Repeatable` instead.'
        value: 'java.lang.annotation.Repeatable'
      - reason: 'Kotlin does not support @Inherited annotation, see https://youtrack.jetbrains.com/issue/KT-22265'
        value: 'java.lang.annotation.Inherited'
  ForbiddenComment:
    active: true
    comments:
      - reason: 'Forbidden FIXME todo marker in comment, please fix the problem.'
        value: 'FIXME:'
      - reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.'
        value: 'STOPSHIP:'
      - reason: 'Forbidden TODO todo marker in comment, please do the changes.'
        value: 'TODO:'
    allowedPatterns: ''
  ForbiddenImport:
    active: false
    imports: []
    forbiddenPatterns: ''
  ForbiddenMethodCall:
    active: false
    methods:
      - reason: 'print does not allow you to configure the output stream. Use a logger instead.'
        value: 'kotlin.io.print'
      - reason: 'println does not allow you to configure the output stream. Use a logger instead.'
        value: 'kotlin.io.println'
  ForbiddenSuppress:
    active: false
    rules: []
  ForbiddenVoid:
    active: true
    ignoreOverridden: false
    ignoreUsageInGenerics: false
  FunctionOnlyReturningConstant:
    active: true
    ignoreOverridableFunction: true
    ignoreActualFunction: true
    excludedFunctions: []
  LoopWithTooManyJumpStatements:
    active: true
    # 2 rather than 1. The parsers and the PTY/stdout readers legitimately need "skip this item" plus
    # "stop reading" in the same loop; forcing that into one jump means a flag variable and a wider
    # condition, which is harder to follow, not easier.
    maxJumpCount: 2
  MagicNumber:
    active: true
    # ChatTheme.kt and JcefTheme.kt ARE the colour palette. A 0xRRGGBB literal inside a property named
    # DIFF_ADDED_BG is not an unexplained number — it is the definition of that name, and wrapping it in
    # DIFF_ADDED_BG_LIGHT = 0xE6FFEC adds a line and explains nothing. The behavioural constants in those two
    # files (timer period, hue step, luminance coefficients, surface nudge) are named anyway, because those
    # genuinely encode decisions someone might revisit — the exclusion buys silence on the palette, not on them.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**', '**/*.kts', '**/ui/ChatTheme.kt', '**/ui/jcef/JcefTheme.kt']
    ignoreNumbers:
      - '-1'
      - '0'
      - '1'
      - '2'
      - '3'
      - '100'
      - '1000'
      # The 4-px spacing grid this UI is laid out on. A number earns a name when the name carries information
      # the number does not: `86400` hides "a day" and gets one; the `8` in `JBUI.Borders.empty(8, 8, 4, 8)`
      # hides nothing, because the call's own parameter order (top, left, bottom, right) already says what each
      # position means. Renaming those to PAD_M makes the line longer and tells the reader strictly less.
      - '4'
      - '6'
      - '8'
      - '10'
      - '12'
      - '16'
    # A named constant is worth it when the number encodes a DECISION someone might revisit. It is noise
    # when the number is the arithmetic itself: `n / 1000.0` to render "1.5k", `* 100` for a percentage,
    # a UI inset of 8. These exclusions keep the rule pointed at thresholds, timeouts and limits — where
    # an unexplained literal really is a question with no answer in the code.
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: false
    ignoreNamedArgument: true
    ignoreEnums: false
    ignoreRanges: false
    ignoreExtensionFunctions: true
  MandatoryBracesLoops:
    active: false
  MaxChainedCallsOnSameLine:
    active: false
    maxChainedCalls: 5
  MaxLineLength:
    active: true
    # Tests are excluded, and the reason is specific rather than a blanket pass. 26 of the 28 over-length lines
    # in the test tree are single-line raw-string PROTOCOL FIXTURES — one NDJSON frame each, exactly as the
    # binary emits it. `excludeRawStrings` below is meant for precisely this, but it only skips lines *inside* a
    # multi-line raw string, so the one-line form (`val line = """{...}"""`) still trips the rule. Splitting
    # those fixtures across concatenated pieces would make them harder to read and easier to typo, and would
    # misrepresent the thing under test: the protocol is one line per frame. The two genuine over-length code
    # lines in tests were wrapped rather than left to hide behind this.
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    # 140, matching Spotless/ktlint and the width this codebase has been written at since the start.
    # Reflowing 13k lines to detekt's 120 default would produce a huge diff, poison `git blame`, and buy
    # nothing: the argument for a limit is readability, and these lines are already readable.
    maxLineLength: 140
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
    excludeRawStrings: true
  MayBeConst:
    active: true
  ModifierOrder:
    active: true
  MultilineLambdaItParameter:
    active: false
  MultilineRawStringIndentation:
    active: false
    indentSize: 4
    trimmingMethods:
      - 'trimIndent'
      - 'trimMargin'
  NestedClassesVisibility:
    active: true
  NewLineAtEndOfFile:
    active: true
  NoTabs:
    active: false
  NullableBooleanCheck:
    active: false
  ObjectLiteralToLambda:
    active: true
  OptionalAbstractKeyword:
    active: true
  OptionalUnit:
    active: false
  PreferToOverPairSyntax:
    active: false
  ProtectedMemberInFinalClass:
    active: true
  RedundantExplicitType:
    active: false
  RedundantHigherOrderMapUsage:
    active: true
  RedundantVisibilityModifierRule:
    active: false
  ReturnCount:
    active: true
    # excludeGuardClauses: true, and this is the important one. The default (count every return, max 2)
    # is in direct conflict with a stated project value — CLAUDE.md asks for "guard clauses frente a
    # anidación profunda" — and with idiomatic Kotlin. Early returns that validate and bail are the thing
    # that keeps SensitiveGuard and the protocol parsers flat and readable; penalising them would push the
    # code toward nested ifs, which is worse by every measure the rule claims to care about.
    #
    # max: 6, because `excludeGuardClauses` is narrower than the concept it is named after. detekt only treats
    # returns as guard clauses while they form an unbroken PREFIX of the function body; the first `val` binding
    # ends the prefix and every later early-out is counted in full. So the shape this codebase actually uses —
    #     val hits = lookUp(name)
    #     if (hits.size != 1) return null
    #     val psi = hits.first() as? PsiElement ?: return null
    #     …
    # scores 5 despite being guard clauses end to end. 6 is the observed ceiling for that shape here; a
    # seventh exit is a genuine signal that the function is doing two jobs.
    max: 6
    excludedFunctions:
      - 'equals'
    excludeLabeled: false
    excludeReturnFromLambda: true
    excludeGuardClauses: true
