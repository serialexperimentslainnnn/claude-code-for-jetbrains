# Dependabot.
#
# The `github-actions` ecosystem is the load-bearing one here. Every action in .github/workflows is
# pinned by full commit SHA, which is the right call for supply-chain reasons and would rot instantly
# without something proposing the bumps — a stale pin is a pin to unpatched code. Dependabot understands
# SHA pins and rewrites both the SHA and the `# vX.Y.Z` comment, so the pinning costs no manual work.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Monthly, not weekly. Every proposed bump costs a full pipeline and a review, and weekly produced
      # more of both than the changes justified — build tooling that moves a patch version does not need
      # attention four times a month. SECURITY updates are unaffected: they arrive on their own schedule
      # regardless of this interval, which is the point of separating them.
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build       # Conventional Commits — the commit-msg hook and the changelog both depend on it
      include: scope
    labels: [dependencies, ci]
    groups:
      # Every action here is pinned by full commit SHA, so a bump is a one-line SHA change per action and
      # reviewing them one PR at a time buys nothing but pipeline runs.
      actions:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # A major of an action can change its inputs or its runtime, and every one here is pinned by commit
      # SHA — so the diff is opaque by design and the changelog is the only way to know what moved.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # Build tooling only: vitest/jsdom for the frontend tests, commitlint for the commit gate, and the
  # Agent SDK as protocol reference. None of it ships (see SECURITY.md), which is exactly why the
  # updates are grouped — they are maintenance, not security releases, and one PR a week is enough.
  - package-ecosystem: npm
    directory: /
    schedule:
      # Monthly, not weekly. Every proposed bump costs a full pipeline and a review, and weekly produced
      # more of both than the changes justified — build tooling that moves a patch version does not need
      # attention four times a month. SECURITY updates are unaffected: they arrive on their own schedule
      # regardless of this interval, which is the point of separating them.
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: [minor, patch]
      # Security updates are a SEPARATE stream: they ignore `open-pull-requests-limit` entirely, and the
      # group above does not cover them because `applies-to` defaults to version-updates. That is how five
      # landed at once despite a limit of three — each firing a full pipeline, verifier included, for
      # transitive devDependencies that are never distributed (`npm audit --omit=dev` reports 0).
      # One PR for the lot: same review, one CI run.
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Majors are proposed by a human, not by a bot. They are where a bump actually breaks something, they
      # need reading the changelog and running the suite, and a PR that sits open for weeks re-running CI on
      # every merge into develop is worse than no PR. Patch and minor keep arriving grouped.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # The SDK baseline is not Dependabot's to move. `checkDrift` bumps it as part of a *reconciled*
      # protocol review — taking the new version without reading the surface diff is how a protocol gap
      # gets silently blessed.
      - dependency-name: '@anthropic-ai/claude-agent-sdk'

  - package-ecosystem: gradle
    directory: /
    schedule:
      # Monthly, not weekly. Every proposed bump costs a full pipeline and a review, and weekly produced
      # more of both than the changes justified — build tooling that moves a patch version does not need
      # attention four times a month. SECURITY updates are unaffected: they arrive on their own schedule
      # regardless of this interval, which is the point of separating them.
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies]
    groups:
      # Patch and minor bumps of build tooling reviewed together. A MAJOR stays on its own PR on purpose:
      # this ecosystem is where a bump can hang the headless suite (the 2.16 -> 2.18 platform-plugin
      # attempt did exactly that), so a major deserves its own run and its own decision.
      build-tooling:
        patterns: ['*']
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Majors by hand — and this ecosystem is the cautionary tale: the IntelliJ Platform Gradle Plugin
      # 2.16 -> 2.18 bump passed CI and hung the headless suite locally, forever, inside the platform's own
      # test fixture. A bot cannot make that call and CI would not have caught it either.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # kotlinx-serialization is provided by the IntelliJ Platform at runtime; the declared version has
      # to match what the targeted IDEs ship, not the newest release. Bumping it blindly is a
      # NoSuchMethodError on a user's IDE, not an upgrade.
      - dependency-name: 'org.jetbrains.kotlinx:kotlinx-serialization-json'

  # The CI images themselves. Every job in ci.yml, codeql.yml, drift.yml and release.yml runs inside
  # `ghcr.io/serialexperimentslainnnn/{jvm,node}-test`, built from `.github/ci-image/*.Dockerfile` — so the
  # base image of those files is the operating system the whole gate executes on, and until now NOTHING
  # proposed a bump for it. `github-actions` does not cover it (it updates `uses:`, not `container:`), and
  # neither did the npm or gradle ecosystems. An unwatched base image is the one dependency where "nobody
  # changed anything" and "it stopped receiving security patches" are the same sentence.
  #
  # Dependabot's docker fetcher matches any filename containing `dockerfile` (case-insensitive), so
  # `jvm-test.Dockerfile` and `node-test.Dockerfile` are both picked up — but it does NOT recurse, hence the
  # explicit directory. It parses one dependency per `FROM`: in practice that is `fedora:44` in
  # node-test.Dockerfile, since jvm-test.Dockerfile's `FROM ${NODE_IMAGE}` resolves through an ARG.
  - package-ecosystem: docker
    directory: /.github/ci-image
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, ci]
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
    # Deliberately NO `ignore` of majors here, unlike every other ecosystem above. A base image pinned to
    # `fedora:44` has no minors and no patches to propose — a major IS the only update that exists, so
    # ignoring majors would leave this block doing precisely nothing, which is worse than not having it:
    # it would read as coverage. A distro bump is still a human decision; the bot's job is to make sure the
    # decision gets put in front of someone instead of being reached by nobody.
