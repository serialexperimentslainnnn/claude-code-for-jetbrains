# CodeQL — static analysis of the two languages that actually ship.
#
# Both matter and for different reasons. The Kotlin is the host: it spawns a process, answers a control
# protocol, and decides what a model is allowed to touch. The JavaScript is the JCEF web app: it renders
# untrusted model output into a DOM, which is the only place in this plugin where "content becomes code"
# is even conceivable (the hash-pinned CSP is why it is not — see ADR 0002).
name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Weekly, because a finding can appear without the code changing: the query packs are updated
    # continuously, so today's clean scan is not a statement about next month's known patterns.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The two languages were one matrix, and splitting them is not cosmetic: only ONE of them wants a
# container, and a matrix cannot express "container here, bare runner there" without `fromJSON` gymnastics
# around a `credentials:` block.
#
#   java-kotlin  needs a JDK and a full Gradle resolution of the IntelliJ Platform, so it runs in
#                jvm-test and inherits the warm GRADLE_USER_HOME. It used to provision the JDK with
#                setup-java and resolve the platform from cold on every run.
#   javascript-typescript  is `build-mode: none`. It needs no JDK, no Gradle and no npm install — the
#                scanner reads the sources. Putting it in an image would add a pull to a job that would
#                use none of it, making it strictly slower. It stays on the bare runner.
jobs:
  analyze-kotlin:
    name: CodeQL (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      # `jvm-test`: the manual build is `./gradlew classes`, which resolves the whole IntelliJ Platform.
      image: ghcr.io/serialexperimentslainnnn/jvm-test:v1.0.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read # pull the CI image
      security-events: write # publish findings to the Security tab
    env:
      # MUST match GRADLE_USER_HOME in .github/ci-image/Dockerfile. If these diverge, the warmed caches
      # baked into the image are invisible and this job silently re-resolves the whole platform.
      GRADLE_USER_HOME: /opt/gradle-home
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.console=plain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `setup-java` step: the image already carries the Temurin 21 the rest of the pipeline builds
      # with. Provisioning a second JDK here meant CodeQL analysed a build that used a different one.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: java-kotlin
          build-mode: manual
          # security-extended over the default pack: this is a security-sensitive plugin with real
          # users, and the extra precision cost is a few minutes on a free runner.
          queries: security-extended

      # Give CodeQL's build tracer the filename Fedora's loader asks for.
      #
      # `Initialize CodeQL` exports
      #   LD_PRELOAD=<bundle>/tools/linux64/${LIB}_${PLATFORM}_trace.so
      # where `$LIB` and `$PLATFORM` are glibc dynamic string tokens that ld.so expands at load time — one
      # variable covering several ABIs. Measured locally: Fedora 44's loader expands them to
      # `lib64_x86_64`, and Ubuntu 24.04's does not resolve that form at all. CodeQL is built and tested on
      # Ubuntu runners, so the shipped filename matches Ubuntu's expansion and Fedora asks for a name that
      # is not in the bundle. The result is the (misleadingly calm) line
      #
      #   ERROR: ld.so: object '.../${LIB}_${PLATFORM}_trace.so' from LD_PRELOAD
      #          cannot be preloaded (cannot open shared object file): ignored
      #
      # on every run since this job moved into a container. Compare github/codeql-action#1113, where the
      # same message was noise and the real failure was elsewhere — which is exactly why it is worth
      # removing rather than tolerating: a permanent ERROR in a security gate's log trains you to skim past
      # the one that matters.
      #
      # The `ls` is not decoration. It is the evidence that the bundle still has the layout this assumes;
      # deliberately not guarded with `|| true`, so a future CodeQL release that moves these files fails
      # here loudly instead of silently going back to the old behaviour.
      - name: Give CodeQL's tracer the name Fedora's loader expands to
        run: |
          set -euo pipefail

          # Derived from LD_PRELOAD itself, NOT from a glob over the tool cache. The first attempt used
          # `ls -d /__t/CodeQL/*/x64/codeql/tools/linux64` and matched TWO directories — the runner image
          # ships one CodeQL bundle and the action had downloaded another (2.26.1 and 2.26.2 side by side)
          # — so the variable held two paths and every command after it broke. Picking one by sort order
          # would just be a nicer-looking guess; LD_PRELOAD names the exact file the loader will be asked
          # for, so there is nothing left to infer.
          preload="${LD_PRELOAD:-}"
          [ -n "$preload" ] || {
            echo "::error::LD_PRELOAD is unset — CodeQL tracing was never initialised, so this step is"
            echo "::error::patching a problem that no longer exists in the form it was written for."
            exit 1
          }
          echo "CodeQL will ask the loader for: $preload"

          dir=$(dirname "$preload")
          echo "tracers shipped in $dir:"
          ls -la "$dir"/*_trace.so

          # The same string with the tokens resolved the way Fedora's ld.so resolves them. Substitution
          # rather than hardcoding the filename, so this keeps working if CodeQL renames around the tokens.
          want=${preload//'${LIB}'/lib64}
          want=${want//'${PLATFORM}'/x86_64}

          if [ -e "$want" ]; then
            echo "$want already exists — nothing to do."
          else
            # The 64-bit tracer, whatever it is called: everything that is not the 32-bit one.
            src=$(ls "$dir"/*_trace.so | grep -v -- '_i386_' | head -1)
            [ -n "$src" ] || { echo "::error::no 64-bit tracer found in $dir"; exit 1; }
            ln -sv "$src" "$want"
          fi

      # Manual build rather than autobuild: autobuild guesses, and this project's build resolves the
      # whole IntelliJ Platform. `classes` compiles main + resources without running tests twice.
      - name: Build (Kotlin)
        run: ./gradlew --no-daemon --stacktrace classes

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:java-kotlin

  analyze-javascript:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:javascript-typescript
